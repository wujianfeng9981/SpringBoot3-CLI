server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path:
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: springboot3.4.x-init
  # 默认 dev 环境
  profiles:
    active: dev

  datasource:
    # MySQL配置（需要安装MySQL）
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # url: ${MYSQL_URL:jdbc:mysql://localhost:3306/example?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    # username: ${MYSQL_USERNAME:root}
    # password: ${MYSQL_PASSWORD:root}
    
    # H2内存数据库配置（测试用，无需安装）
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:example;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password:




mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

path:
  file-upload-path: xxx

springdoc:
  api-docs:
    path: /v3/api-docs  # 配置 OpenAPI 文档的路径
  swagger-ui:
    path: /swagger-ui.html  # 配置 Swagger UI 的路径
    enabled: true  # 启用 Swagger UI


